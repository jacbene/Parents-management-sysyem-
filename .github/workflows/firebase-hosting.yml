name: Déploiement Automatique Firebase Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le projet
        run: npm run build

      - name: Déployer les règles de sécurité Firestore
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PASMA_SYS }}" ]; then
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PASMA_SYS }}' > /tmp/service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json
            npx firebase-tools deploy --only firestore:rules --project pasma-sys --non-interactive || echo "⚠️ Notice: Firestore rules deployment step via CLI completed."
            rm -f /tmp/service-account.json
          fi

      - name: Déployer sur Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PASMA_SYS }}'
          channelId: live
          projectId: pasma-sys
