name: Déploiement Automatique Firebase Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le projet
        run: npm run build

      - name: Déployer les règles de sécurité Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PASMA_SYS }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_PASMA_SYS is required to deploy Firestore rules." >&2
            exit 1
          fi
          account_file="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$account_file"
          GOOGLE_APPLICATION_CREDENTIALS="$account_file" npx firebase-tools deploy --only firestore:rules --project pasma-sys --non-interactive

      - name: Déployer sur Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PASMA_SYS }}'
          channelId: live
          projectId: pasma-sys
